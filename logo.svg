<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ocean" cx="40%" cy="33%" r="78%">
      <stop offset="0%" stop-color="#cfe6ff"/>
      <stop offset="35%" stop-color="#4f97f2"/>
      <stop offset="72%" stop-color="#1f66cc"/>
      <stop offset="100%" stop-color="#0c3a8c"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fc"/>
      <stop offset="100%" stop-color="#c4d4e4"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34499c"/>
      <stop offset="100%" stop-color="#16235f"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="100" cy="100" r="94"/></clipPath>
  </defs>

  <!-- เงาใต้โลก -->
  <ellipse cx="100" cy="190" rx="64" ry="9" fill="#000" opacity="0.16"/>
  <!-- โลก -->
  <circle cx="100" cy="100" r="94" fill="url(#ocean)"/>

  <!-- ทวีป (เงาขาว-เงิน) -->
  <g clip-path="url(#globe)" fill="url(#land)" opacity="0.92">
    <!-- อเมริกาเหนือ -->
    <path d="M40 44 C58 38 70 46 66 58 C78 60 70 76 58 74 C60 86 46 86 44 76 C32 74 28 56 40 44 Z"/>
    <!-- อเมริกาใต้ -->
    <path d="M66 116 C78 112 84 124 78 140 C74 158 64 168 60 156 C56 142 56 126 66 116 Z"/>
    <!-- ยุโรป/แอฟริกา -->
    <path d="M112 50 C128 46 140 56 134 66 C146 70 138 86 128 84 C134 104 120 130 110 142 C104 126 110 104 104 92 C96 80 100 58 112 50 Z"/>
    <!-- เอเชียตะวันออก/หมู่เกาะ -->
    <path d="M150 64 C162 62 168 74 158 80 C150 84 144 74 150 64 Z"/>
    <path d="M150 104 C158 102 160 112 152 114 C145 115 143 106 150 104 Z"/>
  </g>

  <!-- เส้นลองจิจูด/ละติจูด -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.40" stroke-width="1.5" clip-path="url(#globe)">
    <ellipse cx="100" cy="100" rx="38" ry="94"/>
    <ellipse cx="100" cy="100" rx="72" ry="94"/>
    <line x1="6" y1="100" x2="194" y2="100"/>
    <path d="M16 60 H184"/>
    <path d="M16 140 H184"/>
  </g>
  <!-- ไฮไลต์ผิวโลก -->
  <ellipse cx="72" cy="60" rx="40" ry="24" fill="#ffffff" opacity="0.20"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#0c3a8c" stroke-width="2"/>

  <!-- ตัวอักษร BWP ขอบฟ้าสว่างแบบต้นฉบับ -->
  <text x="100" y="103" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="84"
        fill="url(#ink)" stroke="#a9cdf5" stroke-width="2.4" paint-order="stroke" letter-spacing="-5">BWP</text>
</svg>
